<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stands Zina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#E9E6DF; --panel:#F4F2EC; --ink:#22251F; --ink-2:#5C6157; --line:#CFCBC0;
  --accent:#2F5D50; --accent-ink:#F4F2EC; --piece:#F1EFEA; --logo:#1B1C1B; --floor:#D6D2C8; --grid:#BDB8AC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1E1D; --panel:#242726; --ink:#ECE9E1; --ink-2:#A3A79E; --line:#3A3E3B;
    --accent:#7FB8A4; --accent-ink:#152420; --piece:#DCD9D2; --logo:#141514; --floor:#2A2D2C; --grid:#3E4240;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1E1D; --panel:#242726; --ink:#ECE9E1; --ink-2:#A3A79E; --line:#3A3E3B;
  --accent:#7FB8A4; --accent-ink:#152420; --piece:#DCD9D2; --logo:#141514; --floor:#2A2D2C; --grid:#3E4240;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;height:100vh;display:grid;grid-template-columns:320px 1fr;grid-template-rows:100%;overflow:hidden}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
header{padding:22px 22px 14px}
header h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--ink-2);font-size:13.5px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{appearance:none;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:16px 22px;cursor:pointer;color:var(--ink);font:inherit;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
.item:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.item[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.item .k{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;font-weight:500;color:var(--accent);line-height:20px;text-align:center;border-radius:4px}
.item[aria-pressed="true"] .k{background:var(--accent);color:var(--accent-ink)}
.item .n{font-weight:600}
.item .d{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.dims{padding:18px 22px;margin:0;display:grid;grid-template-columns:1fr auto;row-gap:7px;column-gap:16px;font-size:13.5px;border-bottom:1px solid var(--line)}
.dims dt{color:var(--ink-2);margin:0}
.dims dd{margin:0;font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;text-align:right}
.dims .h{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.hint{padding:16px 22px;color:var(--ink-2);font-size:13px;margin-top:auto}
.hint kbd{font-family:"JetBrains Mono",monospace;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--bg)}
main{position:relative;min-width:0}
canvas{display:block;width:100%;height:100%}
.tools{position:absolute;top:16px;right:16px;display:flex;gap:8px}
.tools button{font:inherit;font-size:13px;font-weight:500;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.tools button:hover{border-color:var(--accent)}
.tools button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.scale{position:absolute;left:16px;bottom:14px;color:var(--ink-2);font-family:"JetBrains Mono",monospace;font-size:12px}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:46vh}.hint{display:none}}
</style>
</head><body><aside>
  <header>
    <h1>Stands Zina</h1>
    <p>Soporte de etiqueta para mesa. Frente de 150 × 30 mm a 70°. Impresión 3D en dos partes: cuerpo blanco y emblema negro.</p>
  </header>
  <div class="list" id="list"></div>
  <dl class="dims" id="dims"></dl>
  <p class="hint">Arrastrá para girar, rueda o pinza para acercar, <kbd>Shift</kbd> + arrastrar para desplazar. Tocá un componente para ocultarlo. La cuadrícula es de 1 cm.</p>
</aside>
<main>
  <canvas id="c"></canvas>
  <div class="tools">
    <button id="front" type="button">Vista frontal</button>
    <button id="reset" type="button">Reiniciar vista</button>
  </div>
  <div class="scale">1 cuadro = 10 mm</div>
</main>

function parseSTL(b64){
  const bin = atob(b64), n = bin.length, buf = new ArrayBuffer(n), u8 = new Uint8Array(buf);
  for(let i=0;i<n;i++) u8[i]=bin.charCodeAt(i);
  const dv = new DataView(buf), tris = dv.getUint32(80,true), pos = new Float32Array(tris*9);
  let vol=0, o=84;
  const mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9];
  for(let t=0;t<tris;t++){
    o+=12; const v=[];
    for(let k=0;k<3;k++){ const p=[dv.getFloat32(o,true),dv.getFloat32(o+4,true),dv.getFloat32(o+8,true)]; o+=12;
      pos.set(p,t*9+k*3); v.push(p);
      for(let a=0;a<3;a++){ mn[a]=Math.min(mn[a],p[a]); mx[a]=Math.max(mx[a],p[a]); } }
    o+=2;
    const [a,b,c]=v;
    vol += (a[0]*(b[1]*c[2]-b[2]*c[1]) - a[1]*(b[0]*c[2]-b[2]*c[0]) + a[2]*(b[0]*c[1]-b[1]*c[0]))/6;
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.computeVertexNormals();
  g.rotateX(-Math.PI/2);                       // STL Z-up -> three.js Y-up (depth Y -> -Z)
  return {geometry:g, volume:Math.abs(vol)/1000, size:[mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]]};
}
for(const k in MODELS) Object.assign(MODELS[k], parseSTL(MODELS[k].stl));

function updateCam(){

canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,shift:e.shiftKey}; autoSpin=false; canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  if(drag.shift){ const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0), up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
    target.addScaledVector(right,-dx*dist*0.0012).addScaledVector(up,dy*dist*0.0012); }
  else { theta-=dx*0.006; phi=Math.min(2.6,Math.max(0.08,phi-dy*0.006)); } updateCam(); });
canvas.addEventListener('pointerup',()=>drag=null); canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault(); dist=Math.min(900,Math.max(60,dist*Math.exp(e.deltaY*0.0012))); updateCam();},{passive:false});
let pinch=null;
canvas.addEventListener('touchstart',e=>{ if(e.touches.length===2) pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); },{passive:true});
canvas.addEventListener('touchmove',e=>{ if(e.touches.length===2&&pinch){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); dist=Math.min(900,Math.max(60,dist*pinch/d)); pinch=d; updateCam(); } },{passive:true});
function view(t,p,d,spin){ theta=t; phi=p; dist=d; target.set(75,12,-11); autoSpin=spin; updateCam(); }
document.getElementById('reset').onclick=()=>view(HOME.theta,HOME.phi,HOME.dist,true);
document.getElementById('front').onclick=()=>view(0,1.35,300,false);

function resize(){ const w=canvas.clientWidth,h=canvas.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(canvas);

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(){ if(autoSpin&&!reduce){ theta+=0.0025; updateCam(); } renderer.render(scene,camera); requestAnimationFrame(loop); }

// ---------- UI ----------
const list=document.getElementById('list'), dims=document.getElementById('dims');
const fmt=(n,d=1)=>n.toFixed(d).replace('.',',');
const ang=THREE.MathUtils.degToRad(70), mid=3.5+23.5/2, depth=0.8-0.05;
card.position.set(29+117.6/2, mid*Math.sin(ang)-depth*Math.cos(ang), -(mid*Math.cos(ang))-depth*Math.sin(ang));
card.rotation.set(-(Math.PI/2-ang),0,0); card.visible=true;
const vis={cuerpo:true,logo:true};
function toggle(k){ vis[k]=!vis[k]; (k==='cuerpo'?piece:logoMesh).visible=vis[k]; if(k==='cuerpo') card.visible=vis[k];
  for(const b of list.children) b.setAttribute('aria-pressed', String(vis[b.dataset.k])); }
for(const k in MODELS){ const m=MODELS[k]; const b=document.createElement('button'); b.className='item'; b.type='button'; b.dataset.k=k; b.setAttribute('aria-pressed','true');
  b.innerHTML=`<span class="k">${k==='cuerpo'?'1':'2'}</span><span><span class="n">${m.name}</span><div class="d">${m.desc}</div></span>`; b.onclick=()=>toggle(k); list.appendChild(b); }
const c=MODELS.cuerpo, l=MODELS.logo;
const rows=[['h','Medidas exteriores'],['Ancho',fmt(c.size[0],0)+' mm'],['Profundidad',fmt(c.size[1])+' mm'],['Alto',fmt(c.size[2])+' mm'],['Inclinación del frente','70°'],
  ['h','Etiqueta'],['Tamaño a imprimir','118 × 23,5 mm'],['Rebaje','0,8 mm'],['Pestaña','2 mm'],
  ['h','Emblema'],['Diámetro','18 mm'],['Bolsillo','1 mm'],['Relieve','0,6 mm'],
  ['h','Impresión'],['Cuerpo, PLA blanco',fmt(c.volume)+' cm³ · ≈ '+fmt(c.volume*PLA*0.35,0)+' g al 15 %'],['Emblema, PLA negro',fmt(l.volume,2)+' cm³ · ≈ '+fmt(l.volume*PLA,1)+' g']];
dims.innerHTML=rows.map(([a,b],i)=> a==='h'?`<dt class="h" style="grid-column:1/-1;${i?'margin-top:10px':''}">${b}</dt>`:`<dt>${a}</dt><dd>${b}</dd>`).join('');
resize(); updateCam(); loop();
</script>
</body></html>
